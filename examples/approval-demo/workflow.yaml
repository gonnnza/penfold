schema_version: 1
metadata:
  id: approval-demo
  name: Human approval demo
  description: Pausa la ejecución hasta que el usuario apruebe o rechace
inputs:
- id: feature_description
  type: string
  required: true
  default: Revisar propuesta
nodes:
- id: start
  type: input
  label: User Request
  position:
    x: 0.0
    y: 100.0
  config: {}
- id: analyst
  type: agent
  label: Product Analyst
  agent: product-analyst
  position:
    x: 240.0
    y: 100.0
  config:
    inputs:
      feature_description: $inputs.feature_description
- id: approve
  type: approval
  label: Human Approval
  position:
    x: 500.0
    y: 100.0
  config:
    title: ¿Aprobar el análisis?
    message: Revisa los requisitos propuestos.
    inputs:
      requirements: $nodes.analyst.output
- id: output
  type: output
  label: Final Report
  position:
    x: 760.0
    y: 100.0
  config:
    format: json
    inputs:
      result: $nodes.approve.output
edges:
- id: e1
  source: start
  target: analyst
  source_handle: default
  config:
    loop: false
- id: e2
  source: analyst
  target: approve
  source_handle: default
  config:
    loop: false
- id: e3
  source: approve
  target: output
  source_handle: default
  config:
    loop: false
